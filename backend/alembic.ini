; Alembic configuration for JSAN People360.
;
; The database URL is intentionally NOT set here -- alembic/env.py reads it from
; the application settings so that migrations and the running application can
; never disagree about which database they target.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

; Timestamped, descriptive revision filenames: 2026_07_31_1430-ab12cd34_add_x.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

; Keep migration files formatted like the rest of the codebase.
hooks = black,isort
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
isort.type = console_scripts
isort.entrypoint = isort
isort.options = REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
